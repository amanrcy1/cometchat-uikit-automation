# ============================================================================
# CometChat QA Framework — GitHub Actions CI/CD Pipeline
# ============================================================================
#
# Triggers:
#   - Push to main/develop branches
#   - Pull requests to main/develop
#   - Manual dispatch with configurable parameters
#   - Nightly schedule (Mon-Fri 6 AM UTC)
#
# Jobs:
#   1. lint-typecheck    — TypeScript compilation check (fast gate)
#   2. api-tests         — REST API tests (no browser needed)
#   3. ui-tests          — UI functional tests (Chromium)
#   4. integration-tests — End-to-end flow tests (Chromium)
#   5. report            — Merge artifacts, publish report, notify on failure
#
# ============================================================================

name: E2E Test Suite

on:
  push:
    branches: [main, develop]
    paths:
      - 'cometchat-qa-framework/**'
      - '.github/workflows/e2e-tests.yml'

  pull_request:
    branches: [main, develop]
    paths:
      - 'cometchat-qa-framework/**'
      - '.github/workflows/e2e-tests.yml'

  # Nightly regression — Mon-Fri at 6 AM UTC
  schedule:
    - cron: '0 6 * * 1-5'

  # Manual trigger with options
  workflow_dispatch:
    inputs:
      test_layer:
        description: 'Test layer to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ui
          - api
          - integration
      test_tag:
        description: 'Tag filter (e.g. @smoke, @sanity, @chat, @media)'
        required: false
        default: ''
        type: string
      base_url:
        description: 'App URL to test against'
        required: false
        default: 'http://localhost:3000'
      retries:
        description: 'Number of retries for flaky tests'
        required: false
        default: '2'
      debug:
        description: 'Enable debug logging'
        required: false
        default: 'false'
        type: boolean

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Environment variables (available to all jobs) ──
env:
  CI: true
  NODE_VERSION: '20'
  WORKING_DIR: cometchat-qa-framework
  BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:3000' }}
  PRIMARY_UID: ${{ vars.PRIMARY_UID || 'cometchat-uid-1' }}
  SECONDARY_UID: ${{ vars.SECONDARY_UID || 'cometchat-uid-2' }}
  CHAT_TARGET_USER: ${{ vars.CHAT_TARGET_USER || 'George Alan' }}
  COMETCHAT_APP_ID: ${{ secrets.COMETCHAT_APP_ID }}
  COMETCHAT_REGION: ${{ secrets.COMETCHAT_REGION || 'us' }}
  COMETCHAT_AUTH_KEY: ${{ secrets.COMETCHAT_AUTH_KEY }}
  COMETCHAT_API_KEY: ${{ secrets.COMETCHAT_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
  LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
  DEBUG: ${{ github.event.inputs.debug || 'false' }}

jobs:
  # ════════════════════════════════════════════════════════════════
  # Job 1: Lint & Type Check (fast gate — blocks everything else)
  # ════════════════════════════════════════════════════════════════
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Verify test files exist
        run: |
          echo "=== UI Tests ==="
          ls -la tests/ui/*.spec.ts | wc -l
          echo "=== API Tests ==="
          ls -la tests/api/*.spec.ts | wc -l
          echo "=== Integration Tests ==="
          ls -la tests/integration/*.spec.ts | wc -l
          echo "=== Test Data ==="
          ls -la test-data/

  # ════════════════════════════════════════════════════════════════
  # Job 2: API Tests (no browser, fast, runs in parallel)
  # ════════════════════════════════════════════════════════════════
  api-tests:
    name: API Tests
    needs: lint-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event.inputs.test_layer == 'all' ||
      github.event.inputs.test_layer == 'api' ||
      github.event.inputs.test_layer == ''
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run API tests
        run: |
          GREP_ARG=""
          if [ -n "${{ github.event.inputs.test_tag }}" ]; then
            GREP_ARG="--grep ${{ github.event.inputs.test_tag }}"
          fi
          npx playwright test tests/api/ --project=chromium --retries=${{ github.event.inputs.retries || '1' }} $GREP_ARG
        continue-on-error: true

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            ${{ env.WORKING_DIR }}/test-results/
            ${{ env.WORKING_DIR }}/playwright-report/
            ${{ env.WORKING_DIR }}/automation-report.html
            ${{ env.WORKING_DIR }}/error-report.html
          retention-days: 30

  # ════════════════════════════════════════════════════════════════
  # Job 3: UI Tests (browser required, main test suite)
  # ════════════════════════════════════════════════════════════════
  ui-tests:
    name: UI Tests
    needs: lint-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event.inputs.test_layer == 'all' ||
      github.event.inputs.test_layer == 'ui' ||
      github.event.inputs.test_layer == ''
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    # Shard UI tests across 3 parallel runners for speed
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Wait for app to be ready
        run: |
          echo "Waiting for $BASE_URL to be reachable..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" "$BASE_URL" | grep -q "200"; then
              echo "App is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "ERROR: App at $BASE_URL not reachable after 60s"
              exit 1
            fi
            echo "Attempt $i/30 — waiting 2s..."
            sleep 2
          done

      - name: Run UI tests (shard ${{ matrix.shard }}/3)
        run: |
          GREP_ARG=""
          if [ -n "${{ github.event.inputs.test_tag }}" ]; then
            GREP_ARG="--grep ${{ github.event.inputs.test_tag }}"
          fi
          npx playwright test tests/ui/ \
            --project=chromium \
            --shard=${{ matrix.shard }}/3 \
            --retries=${{ github.event.inputs.retries || '2' }} \
            --reporter=list,html,./lib/utils/unified-reporter.ts \
            $GREP_ARG
        continue-on-error: true

      - name: Upload UI test results (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results-shard-${{ matrix.shard }}
          path: |
            ${{ env.WORKING_DIR }}/test-results/
            ${{ env.WORKING_DIR }}/playwright-report/
            ${{ env.WORKING_DIR }}/automation-report.html
            ${{ env.WORKING_DIR }}/error-report.html
          retention-days: 30

  # ════════════════════════════════════════════════════════════════
  # Job 4: Integration Tests (full end-to-end flows)
  # ════════════════════════════════════════════════════════════════
  integration-tests:
    name: Integration Tests
    needs: lint-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event.inputs.test_layer == 'all' ||
      github.event.inputs.test_layer == 'integration' ||
      github.event.inputs.test_layer == ''
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" "$BASE_URL" | grep -q "200"; then
              echo "App is ready!"
              break
            fi
            [ $i -eq 30 ] && echo "App not reachable" && exit 1
            sleep 2
          done

      - name: Run integration tests
        run: |
          GREP_ARG=""
          if [ -n "${{ github.event.inputs.test_tag }}" ]; then
            GREP_ARG="--grep ${{ github.event.inputs.test_tag }}"
          fi
          npx playwright test tests/integration/ \
            --project=chromium \
            --retries=${{ github.event.inputs.retries || '2' }} \
            --workers=1 \
            $GREP_ARG
        continue-on-error: true

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            ${{ env.WORKING_DIR }}/test-results/
            ${{ env.WORKING_DIR }}/playwright-report/
            ${{ env.WORKING_DIR }}/automation-report.html
            ${{ env.WORKING_DIR }}/error-report.html
          retention-days: 30

  # ════════════════════════════════════════════════════════════════
  # Job 5: Merge Reports & Publish
  # ════════════════════════════════════════════════════════════════
  report:
    name: Merge Reports & Notify
    needs: [api-tests, ui-tests, integration-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.WORKING_DIR }}/all-results

      - name: Merge shard reports
        run: |
          # Merge Playwright HTML reports from all shards
          mkdir -p merged-report
          npx playwright merge-reports \
            --reporter=html \
            all-results/ui-test-results-shard-*/playwright-report/ \
            all-results/api-test-results/playwright-report/ \
            all-results/integration-test-results/playwright-report/ \
            2>/dev/null || true

          # Copy automation reports
          for dir in all-results/*/; do
            [ -f "$dir/automation-report.html" ] && cp "$dir/automation-report.html" "merged-report/automation-report-$(basename $dir).html" 2>/dev/null || true
            [ -f "$dir/error-report.html" ] && cp "$dir/error-report.html" "merged-report/error-report-$(basename $dir).html" 2>/dev/null || true
          done

          echo "=== Merged report contents ==="
          ls -la merged-report/ 2>/dev/null || echo "No merged reports"
          ls -la playwright-report/ 2>/dev/null || echo "No playwright report"

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: merged-test-report
          path: |
            ${{ env.WORKING_DIR }}/playwright-report/
            ${{ env.WORKING_DIR }}/merged-report/
          retention-days: 90

      # Deploy report to GitHub Pages (if on main branch)
      - name: Deploy report to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.WORKING_DIR }}/playwright-report
          destination_dir: test-report

      - name: Generate summary
        if: always()
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | ${{ needs.lint-typecheck.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Tests | ${{ needs.api-tests.result == 'success' && '✅ Passed' || needs.api-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| UI Tests | ${{ needs.ui-tests.result == 'success' && '✅ Passed' || needs.ui-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅ Passed' || needs.integration-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }} | **Branch:** ${{ github.ref_name }} | **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 [View Full Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/test-report/)" >> $GITHUB_STEP_SUMMARY

      # Slack notification on failure (nightly or main branch)
      - name: Notify Slack on failure
        if: |
          failure() &&
          (github.event_name == 'schedule' || github.ref == 'refs/heads/main') &&
          secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🔴 E2E Tests Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🔴 *E2E Test Suite Failed*\n\n*Branch:* `${{ github.ref_name }}`\n*Trigger:* ${{ github.event_name }}\n*Commit:* `${{ github.sha }}`\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
